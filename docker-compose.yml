version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: septica-postgres
    environment:
      POSTGRES_DB: septica
      POSTGRES_USER: septica
      POSTGRES_PASSWORD: septica
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septica -d septica"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: septica-backend
    environment:
      DATABASE_URL: postgres://septica:septica@postgres:5432/septica?sslmode=disable
      PORT: 8080
      ENV: development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: