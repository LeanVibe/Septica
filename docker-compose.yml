version: '3.8'

services:
  # PostgreSQL Database with optimized settings
  postgres:
    image: postgres:14-alpine
    container_name: septica-postgres
    environment:
      POSTGRES_DB: septica
      POSTGRES_USER: septica
      POSTGRES_PASSWORD: septica
      PGDATA: /var/lib/postgresql/data/pgdata
      # Performance optimizations
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d/
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septica -d septica"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - septica-network

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: septica-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - septica-network

  # Go Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: septica-backend
    environment:
      DATABASE_URL: postgres://septica:septica@postgres:5432/septica?sslmode=disable
      REDIS_URL: redis://redis:6379
      PORT: 8080
      ENV: production
      GIN_MODE: release
      # Romanian Septica specific configurations
      GAME_MAX_CONCURRENT_GAMES: 1000
      WEBSOCKET_MAX_CONNECTIONS: 2000
      TOURNAMENT_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - septica-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # PWA Frontend with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: septica-frontend
    ports:
      - "8001:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - septica-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Nginx Reverse Proxy for production routing
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: septica-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - septica-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  septica-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16