version: '3.8'

# Romanian Septica Backend - Local Development Environment
# Provides PostgreSQL database + Go backend with health checks and automatic migrations

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: septica-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: septica
      POSTGRES_USER: septica_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-septica_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"

    ports:
      - "5435:5432"  # Map to 5435 to avoid conflicts with local PostgreSQL

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d  # Auto-run migrations on first start

    networks:
      - septica-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U septica_user -d septica"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Go Backend Application
  backend:
    image: septica-backend:latest
    # Uncomment to rebuild from source instead of using pre-built image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: septica-backend
    restart: unless-stopped

    ports:
      - "8082:8082"  # HTTP/WebSocket server

    environment:
      # Server Configuration
      PORT: 8082
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # Database Configuration
      DATABASE_URL: postgresql://septica_user:${DB_PASSWORD:-septica_dev_password}@postgres:5432/septica?sslmode=disable

      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production_minimum_32_chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}

      # WebSocket Configuration
      WS_READ_BUFFER_SIZE: ${WS_READ_BUFFER_SIZE:-1024}
      WS_WRITE_BUFFER_SIZE: ${WS_WRITE_BUFFER_SIZE:-1024}
      WS_MESSAGE_LIMIT: ${WS_MESSAGE_LIMIT:-65536}

      # Game Configuration
      MAX_CONCURRENT_GAMES: ${MAX_CONCURRENT_GAMES:-10000}
      GAME_TIMEOUT: ${GAME_TIMEOUT:-30m}
      MOVE_TIMEOUT: ${MOVE_TIMEOUT:-30s}

      # Rate Limiting
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-120}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # Migrations
      SKIP_MIGRATIONS: ${SKIP_MIGRATIONS:-false}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - septica-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Redis for future caching/session management
  # redis:
  #   image: redis:7-alpine
  #   container_name: septica-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - septica-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    name: septica_postgres_data
  # redis_data:
  #   driver: local
  #   name: septica_redis_data

# Custom network for service isolation
networks:
  septica-network:
    driver: bridge
    name: septica_network
