# Romanian Septica Production Server Configuration
server {
    listen 80;
    server_name localhost septica.ro www.septica.ro;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WebSocket connections for real-time multiplayer
    location /ws/ {
        # Rate limiting for WebSocket connections
        limit_req zone=websocket burst=10 nodelay;
        
        proxy_pass http://septica_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket specific timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 75s;
        
        # No buffering for real-time communication
        proxy_buffering off;
    }

    # API endpoints for game logic
    location /api/ {
        # Rate limiting for API calls
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://septica_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API timeouts
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }

    # Health check endpoints
    location /health {
        proxy_pass http://septica_backend;
        access_log off;
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # Backend metrics endpoint (restricted)
    location /metrics {
        proxy_pass http://septica_backend;
        # Restrict access to monitoring systems
        allow 172.20.0.0/16;  # Docker network
        allow 127.0.0.1;      # Localhost
        deny all;
        access_log off;
    }

    # Static frontend assets
    location / {
        proxy_pass http://septica_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Frontend timeouts
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        
        # Cache frontend responses
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
    }

    # Specific handling for PWA assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://septica_frontend;
        
        # Extended caching for static assets
        proxy_cache_valid 200 24h;
        add_header Cache-Control "public, max-age=86400";
        
        # Compression
        gzip_static on;
    }

    # Service worker and manifest files
    location ~* \.(webmanifest|json)$ {
        proxy_pass http://septica_frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        proxy_pass http://septica_frontend;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security: Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~* \.(md|txt|log|env|config)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

