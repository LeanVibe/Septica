name: Romanian Septica Comprehensive Testing

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC to catch regressions
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'
  GO_VERSION: '1.21'

jobs:
  # Pre-flight validation
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      should-run-tests: ${{ steps.changes.outputs.should-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for relevant changes
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          elif git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '\.(js|go|html|css|md)$|playwright\.config\.js|package\.json'; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate file structure
        run: |
          echo "🔍 Validating Romanian Septica file structure..."
          test -f "backend/main.go" || { echo "❌ Backend entry point missing"; exit 1; }
          test -f "frontend/index.html" || { echo "❌ Frontend entry point missing"; exit 1; }
          test -f "playwright.config.js" || { echo "❌ Playwright config missing"; exit 1; }
          test -d "e2e-tests" || { echo "❌ E2E tests directory missing"; exit 1; }
          echo "✅ File structure validation passed"

  # Backend testing
  backend-tests:
    name: Backend Romanian Septica Rules
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Romanian Septica rule tests
        working-directory: ./backend
        run: |
          echo "🇷🇴 Testing Romanian Septica backend rules..."
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Validate Romanian rule compliance
        working-directory: ./backend
        run: |
          echo "🔍 Validating Romanian Septica rule implementation..."
          # Test specific Romanian rules in the game engine
          go test -run "TestRomanianSepticaRuleCompliance" -v ./internal/game/
          go test -run "TestDeckComposition" -v ./internal/game/
          go test -run "TestBeatingRules" -v ./internal/game/
          go test -run "TestPointSystem" -v ./internal/game/

      - name: Build backend
        working-directory: ./backend
        run: |
          echo "🔨 Building Romanian Septica backend..."
          go build -o septica-server ./cmd/server

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v3
        with:
          name: backend-coverage
          path: backend/coverage.html

  # Frontend testing
  frontend-tests:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend structure
        run: |
          echo "🔍 Validating Romanian Septica frontend..."
          test -f "frontend/js/game.js" || echo "⚠️ Main game script missing"
          test -f "frontend/css/style.css" || echo "⚠️ Main stylesheet missing"
          test -f "frontend/index.html" || { echo "❌ Main HTML missing"; exit 1; }

      - name: Check Romanian cultural elements
        run: |
          echo "🇷🇴 Checking Romanian cultural authenticity..."
          if grep -r "Romanian Septica" frontend/; then
            echo "✅ Romanian branding found"
          else
            echo "❌ Romanian branding missing"
            exit 1
          fi

      - name: Lint frontend code
        run: |
          echo "🔍 Linting frontend code..."
          npx eslint frontend/js/ --ext .js || echo "⚠️ Linting warnings found"

  # E2E testing with Playwright
  e2e-tests:
    name: E2E Romanian Septica Testing
    runs-on: ubuntu-latest
    needs: [preflight, backend-tests, frontend-tests]
    if: needs.preflight.outputs.should-run-tests == 'true'
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        test-suite:
          - infrastructure/connectivity.spec.js
          - rules/romanian-septica-validation.spec.js
          - matchmaking/two-tab-auto-matchmaking.spec.js
          - performance/benchmarks.spec.js
          - comprehensive-romanian-septica.spec.js
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Go for backend
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start backend server
        working-directory: ./backend
        run: |
          echo "🚀 Starting Romanian Septica backend..."
          go mod download
          go build -o septica-server ./cmd/server
          ./septica-server &
          echo $! > backend.pid
          # Wait for server to start
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "✅ Backend server ready"
              break
            fi
            echo "⏳ Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Start frontend server
        run: |
          echo "🚀 Starting Romanian Septica frontend..."
          cd frontend && python3 -m http.server 3000 &
          echo $! > frontend.pid
          # Wait for frontend to start
          for i in {1..15}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "✅ Frontend server ready"
              break
            fi
            echo "⏳ Waiting for frontend... ($i/15)"
            sleep 2
          done

      - name: Run E2E tests
        run: |
          echo "🧪 Running Romanian Septica E2E tests..."
          echo "Browser: ${{ matrix.browser }}"
          echo "Test Suite: ${{ matrix.test-suite }}"
          npx playwright test e2e-tests/${{ matrix.test-suite }} --project=${{ matrix.browser }}-desktop --reporter=json,html

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Cleanup servers
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) || true
            rm frontend.pid
          fi

  # Stress testing
  stress-tests:
    name: Stress & Performance Testing
    runs-on: ubuntu-latest
    needs: [preflight, e2e-tests]
    if: needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Go for backend
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          # Start backend
          cd backend && go mod download && go build -o septica-server ./cmd/server
          ./septica-server &
          backend_pid=$!

          # Start frontend
          cd ../frontend && python3 -m http.server 3000 &
          frontend_pid=$!

          # Wait for services
          sleep 10

          echo "backend_pid=$backend_pid" >> $GITHUB_ENV
          echo "frontend_pid=$frontend_pid" >> $GITHUB_ENV

      - name: Run stress tests
        run: |
          echo "🔥 Running Romanian Septica stress tests..."
          npx playwright test e2e-tests/performance/stress-testing.spec.js --project=chromium-desktop --reporter=json

      - name: Performance benchmarks
        run: |
          echo "⚡ Running performance benchmarks..."
          npx playwright test e2e-tests/performance/benchmarks.spec.js --project=chromium-desktop --reporter=json

      - name: Cleanup
        if: always()
        run: |
          kill ${{ env.backend_pid }} || true
          kill ${{ env.frontend_pid }} || true

  # Regression testing
  regression-tests:
    name: Regression Prevention
    runs-on: ubuntu-latest
    needs: [preflight, e2e-tests]
    if: needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Go for backend
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          # Start backend
          cd backend && go mod download && go build -o septica-server ./cmd/server
          ./septica-server &

          # Start frontend
          cd ../frontend && python3 -m http.server 3000 &

          # Wait for services
          sleep 10

      - name: Run regression tests
        run: |
          echo "🔒 Running regression prevention tests..."
          npx playwright test e2e-tests/regression/prevention-suite.spec.js --project=chromium-desktop --reporter=json

      - name: Validate Romanian rule compliance
        run: |
          echo "🇷🇴 Validating Romanian Septica rule compliance..."
          npx playwright test e2e-tests/rules/romanian-septica-validation.spec.js --project=chromium-desktop --reporter=json

  # Comprehensive test report
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, stress-tests, regression-tests]
    if: always() && needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download all test artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Generate comprehensive report
        run: |
          echo "📊 Generating Romanian Septica test report..."

          # Create test summary
          cat > test-summary.md << 'EOF'
          # Romanian Septica Testing Report

          **Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit**: ${{ github.sha }}
          **Branch**: ${{ github.ref_name }}

          ## Test Results Summary

          ### Backend Tests
          - **Status**: ${{ needs.backend-tests.result }}
          - **Romanian Rule Compliance**: Verified

          ### Frontend Tests
          - **Status**: ${{ needs.frontend-tests.result }}
          - **Cultural Authenticity**: Validated

          ### E2E Tests
          - **Status**: ${{ needs.e2e-tests.result }}
          - **Two-Tab Matchmaking**: Tested
          - **Romanian Rules**: Validated

          ### Stress Tests
          - **Status**: ${{ needs.stress-tests.result }}
          - **Performance**: Benchmarked

          ### Regression Tests
          - **Status**: ${{ needs.regression-tests.result }}
          - **Rule Compliance**: Verified

          ## Overall Assessment

          EOF

          # Determine overall status
          if [[ "${{ needs.backend-tests.result }}" == "success" &&
                "${{ needs.frontend-tests.result }}" == "success" &&
                "${{ needs.e2e-tests.result }}" == "success" ]]; then
            echo "🟢 **PASSED** - Romanian Septica system is functioning correctly" >> test-summary.md
          else
            echo "🔴 **FAILED** - Issues detected in Romanian Septica system" >> test-summary.md
          fi

          cat test-summary.md

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Upload test report
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-test-report
          path: |
            test-summary.md
            artifacts/

  # Deployment readiness check
  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests, stress-tests, regression-tests]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.should-run-tests == 'true'
    steps:
      - name: Evaluate deployment readiness
        run: |
          echo "🔍 Evaluating Romanian Septica deployment readiness..."

          backend_status="${{ needs.backend-tests.result }}"
          frontend_status="${{ needs.frontend-tests.result }}"
          e2e_status="${{ needs.e2e-tests.result }}"
          stress_status="${{ needs.stress-tests.result }}"
          regression_status="${{ needs.regression-tests.result }}"

          echo "Backend Tests: $backend_status"
          echo "Frontend Tests: $frontend_status"
          echo "E2E Tests: $e2e_status"
          echo "Stress Tests: $stress_status"
          echo "Regression Tests: $regression_status"

          if [[ "$backend_status" == "success" &&
                "$frontend_status" == "success" &&
                "$e2e_status" == "success" &&
                "$regression_status" == "success" ]]; then
            echo "🟢 DEPLOYMENT READY: All critical tests passed"
            echo "✅ Romanian Septica system is ready for production"
            echo "deployment_ready=true" >> $GITHUB_OUTPUT
          else
            echo "🔴 DEPLOYMENT BLOCKED: Critical tests failed"
            echo "❌ Romanian Septica system is not ready for production"
            echo "deployment_ready=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Create deployment tag
        if: success()
        run: |
          echo "🏷️ Creating deployment tag for Romanian Septica..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tag_name="deploy-$(date +%Y%m%d-%H%M%S)"
          git tag -a "$tag_name" -m "Deployment ready: Romanian Septica testing passed"
          git push origin "$tag_name"

          echo "✅ Created deployment tag: $tag_name"