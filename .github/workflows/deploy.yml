name: Romanian Septica - Deployment Pipeline

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Romanian Septica Backend Tests
  backend-tests:
    name: Backend Tests - Romanian Game Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Romanian Septica game tests
        working-directory: ./backend
        run: |
          echo "🇷🇴 Testing Romanian Septica game rules..."
          go test -v -race -coverprofile=coverage.out ./internal/game/...

      - name: Run backend unit tests
        working-directory: ./backend
        run: |
          go test -v -race -coverprofile=coverage-all.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage-all.out
          flags: backend

  # Frontend PWA Tests
  frontend-tests:
    name: Frontend PWA Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate PWA manifest
        working-directory: ./frontend
        run: |
          echo "📱 Validating PWA manifest..."
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"

      - name: Validate Service Worker
        working-directory: ./frontend
        run: |
          echo "⚙️ Checking Service Worker..."
          if [ -f "service-worker.js" ]; then
            echo "✅ Service Worker found"
          else
            echo "❌ Service Worker missing"
            exit 1
          fi

      - name: Check Romanian cultural assets
        working-directory: ./frontend
        run: |
          echo "🇷🇴 Verifying Romanian cultural assets..."
          ls -la assets/ || echo "Assets directory not found"
          ls -la images/ || echo "Images directory not found"

  # Build and Push Docker Images
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubernetes context
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy backend to staging
        run: |
          ./scripts/deploy-backend.sh staging ${{ github.sha }}

      - name: Deploy frontend to staging
        run: |
          ./scripts/deploy-frontend.sh staging

      - name: Run health checks
        run: |
          ./scripts/health-check.sh staging

      - name: Notify deployment status
        if: always()
        run: |
          echo "🇷🇴 Romanian Septica deployed to staging"
          echo "URL: https://staging.septica.ro"

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubernetes context
        run: |
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Create database backup
        run: |
          ./scripts/backup-database.sh ./backups prod

      - name: Deploy backend to production
        run: |
          ./scripts/deploy-backend.sh prod ${{ github.ref_name }}

      - name: Deploy frontend to production
        run: |
          ./scripts/deploy-frontend.sh prod

      - name: Run health checks
        run: |
          ./scripts/health-check.sh prod

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed - initiating rollback"
          ./scripts/rollback.sh all prod

      - name: Create GitHub release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Romanian Septica ${{ github.ref_name }}
          body: |
            🇷🇴 Romanian Septica Release ${{ github.ref_name }}

            ## What's New
            - Authentic Romanian card game experience
            - Premium Three.js PWA frontend
            - Real-time WebSocket multiplayer
            - Cultural heritage preservation

            ## Deployment
            - Backend version: ${{ github.sha }}
            - Frontend version: ${{ github.sha }}
            - Database backup: Created

            ## Links
            - Production: https://septica.ro
            - Documentation: https://github.com/${{ github.repository }}
          draft: false
          prerelease: false

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ 🇷🇴 Romanian Septica deployed to production"
          echo "URL: https://septica.ro"

  # iOS Build and Upload
  deploy-ios:
    name: Build & Upload iOS App
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: ios-production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build and upload iOS app
        env:
          APP_STORE_PASSWORD: ${{ secrets.APP_STORE_PASSWORD }}
          APP_STORE_EMAIL: ${{ secrets.APP_STORE_EMAIL }}
          APP_STORE_TEAM_ID: ${{ secrets.APP_STORE_TEAM_ID }}
        run: |
          ./scripts/deploy-ios.sh ${{ steps.version.outputs.version }} ${{ steps.version.outputs.build_number }} production

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ios-build-${{ steps.version.outputs.version }}
          path: |
            build/*.ipa
            build/*.xcarchive

  # Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Performance Tests
  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run backend load tests
        run: |
          echo "🎮 Running Romanian Septica load tests..."
          # Add k6 or artillery load tests here

      - name: Check response times
        run: |
          RESPONSE_TIME=$(curl -o /dev/null -s -w '%{time_total}' https://staging.septica.ro/api/health)
          echo "Backend response time: ${RESPONSE_TIME}s"
          if (( $(echo "$RESPONSE_TIME > 2.0" | bc -l) )); then
            echo "❌ Response time too slow: ${RESPONSE_TIME}s"
            exit 1
          fi

      - name: Validate 60 FPS frontend performance
        run: |
          echo "📱 Checking frontend performance targets..."
          # Add Lighthouse CI or similar frontend performance tests
