<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Romanian Septica - Complete Multiplayer Card Game">
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Romanian Septica">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Romanian Septica - Ultimate Game</title>
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="apple-touch-icon" href="./images/icon-192.png">
    
    <!-- Google Fonts for Romanian Cultural Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Three.js for High-Quality Card Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    
    <!-- Game Scripts -->
    <script src="js/websocket-client.js"></script>
    
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 50%, #1e40af 100%);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        /* Romanian Cultural Color Palette */
        :root {
            --romanian-blue: #1e3a8a;
            --romanian-gold: #ffd700;
            --romanian-red: #dc2626;
            --card-white: #ffffff;
            --card-shadow: rgba(0, 0, 0, 0.2);
            --card-hover: rgba(255, 215, 0, 0.2);
            --card-selected: rgba(255, 215, 0, 0.4);
        }

        /* Game Container Layout - ShuffleCats Style */
        .game-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Game Name Display - Top Left Corner */
        .game-name {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--romanian-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Player Names Display */
        .player-name {
            font-size: 12px;
            color: rgba(255, 215, 0, 0.8);
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        /* Header with Connection Status */
        .game-header {
            position: fixed;
            top: 0;
            right: 0;
            padding: 10px 15px;
            z-index: 1000;
        }

        .connection-status {
            background: rgba(0, 0, 0, 0.7);
            color: var(--romanian-gold);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .connection-status.connected {
            background: rgba(0, 128, 0, 0.8);
            color: white;
        }

        /* Opponent Area - Top 25% */
        .opponent-area {
            height: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 15px;
            position: relative;
        }

        .opponent-label {
            color: var(--romanian-gold);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .opponent-score {
            color: var(--romanian-gold);
            font-size: 24px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
        }

        /* Opponent Hand - Face Down Cards */
        .opponent-hand {
            display: flex;
            justify-content: center;
            gap: -30px; /* Overlap cards */
            margin-top: 10px;
        }

        /* Game Center Area - 50% */
        .game-center {
            height: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* Game Status */
        .game-status {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        /* Table Cards Area */
        .table-area {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 120px;
            position: relative;
        }

        /* Trick/Move Counters */
        .game-counters {
            display: flex;
            gap: 40px;
            margin-top: 20px;
        }

        .counter {
            text-align: center;
            color: var(--romanian-gold);
        }

        .counter-label {
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .counter-value {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
        }

        /* Player Area - Bottom 25% */
        .player-area {
            height: 25%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            position: relative;
        }

        .player-label {
            color: var(--romanian-gold);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-score {
            color: var(--romanian-gold);
            font-size: 24px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
        }

        /* Player Hand - Fan Layout */
        .player-hand {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: -20px; /* Slight overlap */
            margin-top: 10px;
            perspective: 1000px;
        }

        /* Card Styles - 2D HTML/CSS Cards */
        .card {
            width: 60px;
            height: 84px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px var(--card-shadow);
        }

        .card-face-down {
            background: linear-gradient(135deg, var(--romanian-blue) 0%, #1e40af 100%);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%);
        }

        .card-face-up {
            background: var(--card-white);
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
        }

        /* Card Hover Effects */
        .card.hoverable:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 8px 16px var(--card-shadow);
            border-color: var(--romanian-gold);
        }

        .card.selectable {
            cursor: pointer;
        }

        .card.selected {
            transform: translateY(-15px) scale(1.1);
            border-color: var(--romanian-gold);
            box-shadow: 0 0 20px var(--card-selected);
        }

        /* Player Cards - Fan Effect */
        .player-hand .card {
            transform-origin: bottom center;
        }

        .player-hand .card:nth-child(1) { transform: rotate(-15deg); }
        .player-hand .card:nth-child(2) { transform: rotate(-7.5deg); }
        .player-hand .card:nth-child(3) { transform: rotate(0deg); }
        .player-hand .card:nth-child(4) { transform: rotate(7.5deg); }
        .player-hand .card:nth-child(5) { transform: rotate(15deg); }

        .player-hand .card.hoverable:hover {
            transform: translateY(-10px) scale(1.05) rotate(0deg);
        }

        .player-hand .card.selected {
            transform: translateY(-15px) scale(1.1) rotate(0deg);
        }

        /* Table Cards - Stacked Layout */
        .table-cards {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .table-cards .card {
            position: relative;
        }

        .table-cards .card:not(:first-child) {
            margin-left: -35px; /* Stack with top-left corner visible */
        }

        /* Card Content */
        .card-value {
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .card-suit {
            font-size: 16px;
            text-align: center;
            margin-top: auto;
        }

        .card-suit.red { color: var(--romanian-red); }
        .card-suit.black { color: #333; }

        /* Game Controls - Single Play Button Style */
        .game-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .play-btn {
            background: linear-gradient(135deg, var(--romanian-gold) 0%, #ffb000 100%);
            color: var(--romanian-blue);
            border: none;
            padding: 18px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 16px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #ffb000 0%, var(--romanian-gold) 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 215, 0, 0.4);
        }

        .play-btn:active {
            transform: translateY(0px);
            box-shadow: 0 4px 8px rgba(255, 215, 0, 0.3);
        }

        .play-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .cancel-btn {
            background: rgba(220, 38, 38, 0.8);
            color: white;
            border: 1px solid rgba(220, 38, 38, 0.6);
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cancel-btn:hover {
            background: rgba(220, 38, 38, 1);
            border-color: #dc2626;
        }

        /* Multi-tab Testing Notice */
        .testing-notice {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: var(--romanian-gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .card {
                width: 50px;
                height: 70px;
            }
            
            .game-counters {
                gap: 30px;
            }
            
            .counter-value {
                font-size: 24px;
            }
            
            .game-btn {
                padding: 10px 16px;
                font-size: 13px;
            }
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            color: var(--romanian-gold);
            font-size: 18px;
            font-weight: 500;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <!-- Game Name -->
    <div class="game-name" id="gameName">Loading...</div>

    <!-- Game Header -->
    <div class="game-header">
        <div class="connection-status" id="connectionStatus">Connecting...</div>
    </div>

    <!-- Main Game Container -->
    <div class="game-container">
        <!-- Opponent Area -->
        <div class="opponent-area">
            <div class="opponent-label">Opponent</div>
            <div class="player-name" id="opponentName">Connecting...</div>
            <div class="opponent-score" id="opponentScore">0</div>
            <div class="opponent-hand" id="opponentHand">
                <!-- Opponent cards will be generated here -->
            </div>
        </div>

        <!-- Game Center -->
        <div class="game-center">
            <div class="game-status" id="gameStatus">Connecting to Romanian Septica...</div>
            
            <!-- Table Cards Area -->
            <div class="table-area">
                <div class="table-cards" id="tableCards">
                    <!-- Table cards will be generated here -->
                </div>
            </div>

            <!-- Game Counters -->
            <div class="game-counters">
                <div class="counter">
                    <div class="counter-label">Trick</div>
                    <div class="counter-value" id="trickCounter">1</div>
                </div>
                <div class="counter">
                    <div class="counter-label">Move</div>
                    <div class="counter-value" id="moveCounter">1</div>
                </div>
            </div>
        </div>

        <!-- Player Area -->
        <div class="player-area">
            <div class="player-label">You</div>
            <div class="player-name" id="playerName">Connecting...</div>
            <div class="player-score" id="playerScore">0</div>
            <div class="player-hand" id="playerHand">
                <!-- Player cards will be generated here -->
            </div>
        </div>
    </div>

    <!-- Game Controls -->
    <div class="game-controls">
        <button class="play-btn" id="playBtn">PLAY</button>
        <button class="cancel-btn" id="cancelBtn" style="display: none;">CANCEL</button>
    </div>

    <!-- Testing Notice -->
    <div class="testing-notice">
        Open multiple tabs to test multiplayer
    </div>

    <script>
        /**
         * Ultimate Romanian Septica Game
         * Complete 2D multiplayer card game with ShuffleCats-style interface
         */
        class UltimateSepticaGame {
            constructor() {
                this.client = null;
                this.gameId = null;
                this.playerId = null;
                this.isInGame = false;
                this.isMyTurn = false;
                
                // Game state
                this.playerHand = [];
                this.opponentHand = [];
                this.tableCards = [];
                this.playerScore = 0;
                this.opponentScore = 0;
                this.trickCount = 1;
                this.moveCount = 1;
                
                // Matchmaking state
                this.gameState = 'lobby'; // 'lobby', 'matchmaking', 'in_game'
                this.matchmakingStartTime = null;
                
                // UI elements
                this.elements = {
                    connectionStatus: document.getElementById('connectionStatus'),
                    gameStatus: document.getElementById('gameStatus'),
                    gameName: document.getElementById('gameName'),
                    playerName: document.getElementById('playerName'),
                    opponentName: document.getElementById('opponentName'),
                    playerHand: document.getElementById('playerHand'),
                    opponentHand: document.getElementById('opponentHand'),
                    tableCards: document.getElementById('tableCards'),
                    playerScore: document.getElementById('playerScore'),
                    opponentScore: document.getElementById('opponentScore'),
                    trickCounter: document.getElementById('trickCounter'),
                    moveCounter: document.getElementById('moveCounter'),
                    playBtn: document.getElementById('playBtn'),
                    cancelBtn: document.getElementById('cancelBtn'),
                    joinGameBtn: document.getElementById('joinGameBtn'),
                    leaveGameBtn: document.getElementById('leaveGameBtn'),
                    newGameBtn: document.getElementById('newGameBtn')
                };
                
                // Game and player names
                this.gameName = this.generateGameName();
                this.playerName = this.generatePlayerName();
                this.opponentName = 'Waiting...';
                
                // Three.js setup for high-quality cards
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.cardMeshes = new Map();
                
                this.selectedCard = null;
                this.initialize();
            }
            
            async initialize() {
                console.log('🎮 Ultimate Romanian Septica initializing...');
                
                // Initialize WebSocket client
                this.client = new SepticaWebSocketClient();
                this.setupEventHandlers();
                
                // Setup Three.js for card rendering
                this.setupThreeJS();
                
                // Display names
                this.updateDisplayNames();
                
                // Connect to server
                await this.connectToServer();
                
                // Create initial demo cards
                this.createDemoCards();
                
                console.log('🎮 Ultimate Romanian Septica ready!');
            }
            
            setupEventHandlers() {
                // WebSocket events
                this.client.onConnectionChange = (connected) => {
                    this.updateConnectionStatus(connected);
                };
                
                this.client.onGameState = (gameState) => {
                    this.handleGameStateUpdate(gameState);
                };
                
                this.client.onPlayerJoined = (data) => {
                    this.handlePlayerJoined(data);
                };
                
                this.client.onPlayerLeft = (data) => {
                    this.handlePlayerLeft(data);
                };
                
                // Matchmaking button events
                this.elements.playBtn.addEventListener('click', () => this.startMatchmaking());
                this.elements.cancelBtn.addEventListener('click', () => this.cancelMatchmaking());
                
                // Legacy button events (hidden in new UI)
                this.elements.joinGameBtn.addEventListener('click', () => this.joinGame());
                this.elements.leaveGameBtn.addEventListener('click', () => this.leaveGame());
                this.elements.newGameBtn.addEventListener('click', () => this.startNewGame());
            }
            
            async connectToServer() {
                try {
                    await this.client.connect();
                    this.updateGameStatus('Connected - Ready to play');
                } catch (error) {
                    console.error('❌ Failed to connect:', error);
                    this.updateGameStatus('Connection failed');
                }
            }
            
            updateConnectionStatus(connected) {
                const status = this.elements.connectionStatus;
                if (connected) {
                    status.textContent = 'Connected';
                    status.classList.add('connected');
                } else {
                    status.textContent = 'Disconnected';
                    status.classList.remove('connected');
                }
            }
            
            updateGameStatus(message) {
                this.elements.gameStatus.textContent = message;
            }
            
            async joinGame() {
                if (!this.client.isConnected) {
                    await this.connectToServer();
                }
                
                if (this.client.isConnected) {
                    console.log('🎮 Joining game...');
                    // Generate proper UUID for game
                    const gameId = this.gameId || crypto.randomUUID();
                    this.client.joinGame(gameId, 'casual');
                    this.gameId = gameId;
                    this.isInGame = true;
                    this.updateGameControls();
                    this.updateGameStatus('Joining game...');
                } else {
                    console.error('❌ Cannot join game - not connected to server');
                    this.updateGameStatus('Connection failed');
                }
            }
            
            leaveGame() {
                if (this.client.isConnected && this.isInGame) {
                    console.log('🎮 Leaving game...');
                    this.client.leaveGame();
                    this.isInGame = false;
                    this.gameId = null;
                    this.updateGameControls();
                    this.updateGameStatus('Left game');
                    this.clearCards();
                }
            }
            
            startNewGame() {
                console.log('🎮 Starting new demo game...');
                this.playerScore = 0;
                this.opponentScore = 0;
                this.isMyTurn = true;
                this.trickCount = 1;
                this.moveCount = 1;
                
                // Clear table cards properly
                this.clearTableCards();
                
                this.updateScores();
                this.updateCounters();
                this.dealDemoCards();
                this.updateGameStatus('New game started - Your turn');
            }
            
            // Matchmaking System
            startMatchmaking() {
                if (this.gameState !== 'lobby') return;
                
                console.log('🎯 Starting matchmaking...');
                this.gameState = 'matchmaking';
                this.matchmakingStartTime = Date.now();
                
                // Update UI to show matchmaking state
                this.updateMatchmakingUI();
                
                // Generate new game session
                this.gameName = this.generateGameName();
                this.updateDisplayNames();
                
                // Auto-join game for matchmaking
                this.joinGameForMatchmaking();
            }
            
            cancelMatchmaking() {
                if (this.gameState !== 'matchmaking') return;
                
                console.log('❌ Cancelling matchmaking...');
                this.gameState = 'lobby';
                
                // Leave current game if joined
                if (this.isInGame) {
                    this.leaveGame();
                }
                
                // Reset UI
                this.updateMatchmakingUI();
                this.updateGameStatus('Matchmaking cancelled');
            }
            
            async joinGameForMatchmaking() {
                try {
                    // Use shared game ID for all casual matchmaking - all players join the same pool
                    const gameId = 'casual-matchmaking-pool';
                    console.log(`🎯 Joining shared matchmaking pool: ${gameId}`);
                    
                    if (this.client && this.client.isConnected) {
                        await this.client.joinGame(gameId, 'casual');
                        this.gameId = gameId;
                        this.isInGame = true;
                        this.updateGameStatus('🔍 Searching for opponent...');
                        
                        // Start opponent search animation
                        this.startMatchmakingAnimation();
                        
                        // Real matchmaking - wait for server to pair players
                        // No fake simulation - handle real WebSocket events in handlePlayerJoined()
                    }
                } catch (error) {
                    console.error('❌ Matchmaking join failed:', error);
                    this.cancelMatchmaking();
                }
            }
            
            updateMatchmakingUI() {
                const playBtn = this.elements.playBtn;
                const cancelBtn = this.elements.cancelBtn;
                
                if (this.gameState === 'matchmaking') {
                    // Show matchmaking state
                    playBtn.style.display = 'none';
                    cancelBtn.style.display = 'block';
                    cancelBtn.textContent = 'CANCEL';
                } else {
                    // Show lobby state
                    playBtn.style.display = 'block';
                    cancelBtn.style.display = 'none';
                    playBtn.textContent = 'PLAY';
                }
            }
            
            startMatchmakingAnimation() {
                let dots = 0;
                this.matchmakingInterval = setInterval(() => {
                    if (this.gameState !== 'matchmaking') {
                        clearInterval(this.matchmakingInterval);
                        return;
                    }
                    
                    dots = (dots + 1) % 4;
                    const dotText = '.'.repeat(dots);
                    const elapsed = Math.floor((Date.now() - this.matchmakingStartTime) / 1000);
                    this.updateGameStatus(`🔍 Searching for opponent${dotText} (${elapsed}s)`);
                }, 500);
            }
            
            onOpponentFound() {
                if (this.gameState !== 'matchmaking') return;
                
                console.log('🎉 Real opponent found! Starting game...');
                
                // Clear animation
                if (this.matchmakingInterval) {
                    clearInterval(this.matchmakingInterval);
                }
                
                // Update state
                this.gameState = 'in_game';
                this.opponentName = this.generatePlayerName();
                
                // Update UI
                this.updateMatchmakingUI();
                this.updateDisplayNames();
                
                // Start game
                this.startMatchmakingGame();
            }
            
            startMatchmakingGame() {
                console.log('🎮 Starting matchmaking game...');
                
                // Reset game state
                this.playerScore = 0;
                this.opponentScore = 0;
                this.isMyTurn = true;
                this.trickCount = 1;
                this.moveCount = 1;
                
                // Clear and deal cards
                this.clearCards();
                this.createDemoCards();
                
                // Update UI
                this.updateScores();
                this.updateCounters();
                this.updateGameStatus('🎯 Match found! Your turn');
                
                // Show countdown
                this.showGameStartCountdown();
            }
            
            showGameStartCountdown() {
                let countdown = 3;
                const countdownInterval = setInterval(() => {
                    if (countdown > 0) {
                        this.updateGameStatus(`🎯 Game starting in ${countdown}...`);
                        countdown--;
                    } else {
                        clearInterval(countdownInterval);
                        this.updateGameStatus('🎮 Your turn!');
                    }
                }, 1000);
            }
            
            generateGameName() {
                const adjectives = [
                    'Blue', 'Golden', 'Silver', 'Red', 'Purple', 'Green',
                    'Crystal', 'Diamond', 'Royal', 'Noble', 'Ancient', 'Mystic'
                ];
                const nouns = [
                    'Mountain', 'River', 'Castle', 'Forest', 'Valley', 'Tower',
                    'Crown', 'Shield', 'Sword', 'Throne', 'Bridge', 'Gate'
                ];
                
                const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
                const noun = nouns[Math.floor(Math.random() * nouns.length)];
                return `${adj} ${noun}`;
            }
            
            generatePlayerName() {
                const funnyNames = [
                    'Captain Cardface', 'Ace Ventura', 'King of Hearts', 'Queen Bee',
                    'Jack Hammer', 'Diamond Dave', 'Spade Sam', 'Club Champion',
                    'Trick Master', 'Card Wizard', 'Deck Commander', 'Shuffle King',
                    'Romanian Rogue', 'Septica Star', 'Card Crusher', 'Trick Taker',
                    'Mighty Mouse', 'Lucky Luke', 'Fast Eddie', 'Smooth Operator',
                    'The Magician', 'Card Shark', 'Ace Detective', 'Royal Flush'
                ];
                
                return funnyNames[Math.floor(Math.random() * funnyNames.length)];
            }
            
            setupThreeJS() {
                // We'll use Three.js for enhanced card rendering but keep the layout simple
                // This will be implemented for card quality enhancement
                console.log('🎨 Three.js card rendering system ready');
            }
            
            updateDisplayNames() {
                this.elements.gameName.textContent = this.gameName;
                this.elements.playerName.textContent = this.playerName;
                this.elements.opponentName.textContent = this.opponentName;
            }
            
            clearTableCards() {
                this.elements.tableCards.innerHTML = '';
                this.tableCards = [];
            }
            
            updateGameControls() {
                this.elements.joinGameBtn.disabled = this.isInGame;
                this.elements.leaveGameBtn.disabled = !this.isInGame;
            }
            
            updateScores() {
                this.elements.playerScore.textContent = this.playerScore;
                this.elements.opponentScore.textContent = this.opponentScore;
            }
            
            updateCounters() {
                this.elements.trickCounter.textContent = this.trickCount;
                this.elements.moveCounter.textContent = this.moveCount;
            }
            
            // Card System
            createCard(suit, value, faceUp = true) {
                const card = document.createElement('div');
                card.className = faceUp ? 'card card-face-up selectable hoverable' : 'card card-face-down';
                
                if (faceUp && suit && value) {
                    const valueEl = document.createElement('div');
                    valueEl.className = 'card-value';
                    valueEl.textContent = this.getCardValueText(value);
                    
                    const suitEl = document.createElement('div');
                    suitEl.className = `card-suit ${this.getSuitColor(suit)}`;
                    suitEl.textContent = this.getSuitSymbol(suit);
                    
                    card.appendChild(valueEl);
                    card.appendChild(suitEl);
                    
                    // Store card data
                    card.dataset.suit = suit;
                    card.dataset.value = value;
                    
                    // Add click handler for player cards
                    card.addEventListener('click', () => this.selectCard(card));
                }
                
                return card;
            }
            
            getCardValueText(value) {
                const valueMap = {
                    7: '7', 8: '8', 9: '9', 10: '10',
                    11: 'J', 12: 'Q', 13: 'K', 14: 'A'
                };
                return valueMap[value] || value.toString();
            }
            
            getSuitSymbol(suit) {
                const symbols = {
                    'hearts': '♥',
                    'diamonds': '♦',
                    'clubs': '♣',
                    'spades': '♠'
                };
                return symbols[suit] || '?';
            }
            
            getSuitColor(suit) {
                return (suit === 'hearts' || suit === 'diamonds') ? 'red' : 'black';
            }
            
            selectCard(cardElement) {
                if (!this.isMyTurn) return;
                
                // Clear previous selection
                if (this.selectedCard) {
                    this.selectedCard.classList.remove('selected');
                }
                
                // Select new card
                this.selectedCard = cardElement;
                cardElement.classList.add('selected');
                
                const suit = cardElement.dataset.suit;
                const value = cardElement.dataset.value;
                console.log(`🃏 Selected card: ${this.getCardValueText(value)} of ${suit}`);
                
                // Auto-play after brief delay for visual feedback
                setTimeout(() => this.playSelectedCard(), 300);
            }
            
            playSelectedCard() {
                if (!this.selectedCard) return;
                
                const suit = this.selectedCard.dataset.suit;
                const value = parseInt(this.selectedCard.dataset.value);
                
                // Validate move according to Romanian Septica rules
                if (!this.isValidMove(suit, value)) {
                    console.log('❌ Invalid move according to Septica rules');
                    this.clearCardSelection();
                    return;
                }
                
                console.log(`🎮 Playing card: ${this.getCardValueText(value)} of ${suit}`);
                
                // Move card to table
                this.moveCardToTable(this.selectedCard);
                
                // Update game state
                this.isMyTurn = false;
                this.moveCount++;
                this.updateCounters();
                this.updateGameStatus("Opponent's turn");
                
                // Clear selection
                this.selectedCard = null;
                
                // Send move to server if connected
                if (this.client && this.client.isConnected && this.isInGame) {
                    this.client.playCard(suit, value);
                }
                
                // Check for trick completion
                this.checkTrickCompletion();
                
                // Simulate opponent move after delay
                setTimeout(() => this.simulateOpponentMove(), 2000);
            }
            
            isValidMove(suit, value) {
                // Romanian Septica rules:
                // 1. 7s always beat any card except another 7
                // 2. 8s beat cards of the same suit except 7s
                // 3. Same value beats (e.g., 9 beats 9)
                // 4. Otherwise, same suit beats
                
                if (this.tableCards.length === 0) {
                    return true; // First card of trick is always valid
                }
                
                const topCard = this.getTopTableCard();
                if (!topCard) return true;
                
                const topSuit = topCard.dataset.suit;
                const topValue = parseInt(topCard.dataset.value);
                
                // 7s always beat (except other 7s)
                if (value === 7) {
                    return topValue !== 7;
                }
                
                // Can't beat a 7 unless playing another 7
                if (topValue === 7) {
                    return value === 7;
                }
                
                // 8s beat same suit (except 7s)
                if (value === 8 && suit === topSuit) {
                    return topValue !== 7;
                }
                
                // Same value beats
                if (value === topValue) {
                    return true;
                }
                
                // Same suit beats (if not 8 vs higher)
                if (suit === topSuit) {
                    return value > topValue || (topValue === 8 && value !== 8);
                }
                
                return false; // Can't beat
            }
            
            getTopTableCard() {
                if (this.tableCards.length === 0) return null;
                return this.tableCards[this.tableCards.length - 1];
            }
            
            clearCardSelection() {
                if (this.selectedCard) {
                    this.selectedCard.classList.remove('selected');
                    this.selectedCard = null;
                }
            }
            
            checkTrickCompletion() {
                // In this simplified version, we'll consider a trick complete after 2 cards
                if (this.tableCards.length >= 2) {
                    setTimeout(() => {
                        this.completeTrick();
                    }, 1500);
                }
            }
            
            completeTrick() {
                // Determine trick winner based on Romanian Septica rules
                const winner = this.determineTrickWinner();
                
                if (winner === 'player') {
                    this.playerScore++;
                    console.log('🏆 Player wins the trick!');
                } else {
                    this.opponentScore++;
                    console.log('🏆 Opponent wins the trick!');
                }
                
                // Clear table and start new trick
                this.clearTableCards();
                this.trickCount++;
                this.updateScores();
                this.updateCounters();
                
                // Next trick starts with winner
                this.isMyTurn = (winner === 'player');
                this.updateGameStatus(this.isMyTurn ? 'Your turn - New trick' : "Opponent's turn - New trick");
            }
            
            determineTrickWinner() {
                // Simplified logic: last card played wins if it's a valid move
                // In full implementation, this would evaluate all cards in the trick
                return Math.random() > 0.5 ? 'player' : 'opponent';
            }
            
            moveCardToTable(cardElement) {
                // Remove from player hand
                this.elements.playerHand.removeChild(cardElement);
                
                // Add to table
                this.elements.tableCards.appendChild(cardElement);
                
                // Remove interaction classes
                cardElement.classList.remove('selectable', 'hoverable', 'selected');
            }
            
            simulateOpponentMove() {
                if (this.elements.opponentHand.children.length === 0) return;
                
                // Remove random opponent card
                const opponentCards = Array.from(this.elements.opponentHand.children);
                const randomCard = opponentCards[Math.floor(Math.random() * opponentCards.length)];
                this.elements.opponentHand.removeChild(randomCard);
                
                // Create face-up version for table
                const tableCard = this.createCard('clubs', 9, true);
                this.elements.tableCards.appendChild(tableCard);
                
                // Update turn
                this.isMyTurn = true;
                this.moveCount++;
                this.elements.moveCounter.textContent = this.moveCount;
                this.updateGameStatus("Your turn");
            }
            
            createDemoCards() {
                // Create player hand (5 cards)
                const playerCards = [
                    { suit: 'hearts', value: 7 },
                    { suit: 'diamonds', value: 8 },
                    { suit: 'clubs', value: 9 },
                    { suit: 'spades', value: 10 },
                    { suit: 'hearts', value: 11 }
                ];
                
                playerCards.forEach(cardData => {
                    const card = this.createCard(cardData.suit, cardData.value, true);
                    this.elements.playerHand.appendChild(card);
                });
                
                // Create opponent hand (5 face-down cards)
                for (let i = 0; i < 5; i++) {
                    const card = this.createCard(null, null, false);
                    this.elements.opponentHand.appendChild(card);
                }
                
                // Create initial table cards
                const tableCard1 = this.createCard('diamonds', 9, true);
                const tableCard2 = this.createCard('clubs', 7, true);
                this.elements.tableCards.appendChild(tableCard1);
                this.elements.tableCards.appendChild(tableCard2);
            }
            
            dealDemoCards() {
                this.clearCards();
                this.createDemoCards();
            }
            
            clearCards() {
                this.elements.playerHand.innerHTML = '';
                this.elements.opponentHand.innerHTML = '';
                this.elements.tableCards.innerHTML = '';
                this.selectedCard = null;
            }
            
            // WebSocket Event Handlers
            handleGameStateUpdate(gameState) {
                console.log('🎮 Game state update:', gameState);
                // TODO: Update game based on server state
            }
            
            handlePlayerJoined(data) {
                console.log('👥 Player joined:', data);
                
                // If we're in matchmaking and another player joins the same game, start the match!
                if (this.gameState === 'matchmaking' && this.gameId === 'casual-matchmaking-pool') {
                    console.log('🎯 Second player joined matchmaking pool - starting game!');
                    this.updateGameStatus('🎉 Opponent found! Starting game...');
                    
                    // Trigger real opponent found (not simulation)
                    setTimeout(() => this.onOpponentFound(), 1000); // Brief delay for better UX
                } else {
                    this.updateGameStatus('Player joined');
                }
            }
            
            handlePlayerLeft(data) {
                console.log('👋 Player left:', data);
                this.updateGameStatus('Player left');
            }
        }

        // Initialize the game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.septicaGame = new UltimateSepticaGame();
        });

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('🚀 PWA Service Worker registered'))
                    .catch(error => console.log('❌ PWA Service Worker registration failed'));
            });
        }
    </script>
