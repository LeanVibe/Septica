<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romanian Septica - Playable Demo</title>
    
    <!-- PWA Configuration -->
    <meta name="theme-color" content="#1e3a8a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Romanian Septica">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.ico">
    
    <!-- Three.js CDN -->
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Game Scripts -->
    <script src="js/websocket-client.js"></script>
    <script src="js/mobile-lod-system.js"></script>
    <script src="js/game-ui.js"></script>
    <script src="js/romanian-ambient-lighting.js"></script>
    <script src="js/premium-card-material.js"></script>
    <script src="js/premium-card-animations.js"></script>
    <script src="js/playable-card-interface.js"></script>
    
    <!-- Styling -->
    <link rel="stylesheet" href="css/premium-glass-morphism.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 50%, #1e40af 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #game-canvas {
            display: block;
            cursor: grab;
        }
        
        #game-canvas:active {
            cursor: grabbing;
        }
        
        /* Game UI Overlay */
        .game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .ui-element {
            pointer-events: auto;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* Top UI - Opponent info */
        .top-ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        /* Center UI - Game info */
        .center-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        
        /* Bottom UI - Player info and controls */
        .bottom-ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        /* Side UI - Connection and controls */
        .side-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc2626;
            transition: background-color 0.3s;
        }
        
        .status-dot.connected {
            background: #16a34a;
        }
        
        .game-controls {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Player info */
        .player-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 120px;
        }
        
        .player-name {
            font-weight: bold;
            font-size: 16px;
        }
        
        .player-score {
            font-size: 24px;
            color: #ffd700;
        }
        
        .player-cards {
            font-size: 14px;
            opacity: 0.8;
        }
        
        /* Turn indicator */
        .turn-indicator {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        
        /* Multi-tab testing info */
        .tab-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
        
        /* Quality and region controls */
        .settings-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 200px;
        }
        
        select {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            backdrop-filter: blur(10px);
        }
        
        select option {
            background: #1e3a8a;
            color: white;
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 58, 138, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: white;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .side-ui {
                position: static;
                background: rgba(0, 0, 0, 0.5);
                padding: 10px;
            }
            
            .settings-panel {
                flex-direction: row;
                max-width: none;
            }
            
            .top-ui, .bottom-ui {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading Romanian Septica...</div>
        </div>
        
        <!-- Game Canvas -->
        <canvas id="game-canvas"></canvas>
        
        <!-- Game UI Overlay -->
        <div class="game-ui">
            <!-- Top UI - Opponent Info -->
            <div class="top-ui">
                <div class="ui-element player-info">
                    <div class="player-name">Opponent</div>
                    <div class="player-score" id="opponent-score">0</div>
                    <div class="player-cards" id="opponent-cards">5 cards</div>
                </div>
            </div>
            
            <!-- Center UI - Turn Indicator -->
            <div class="center-ui">
                <div class="ui-element turn-indicator" id="turn-indicator">
                    Your turn
                </div>
            </div>
            
            <!-- Bottom UI - Player Info -->
            <div class="bottom-ui">
                <div class="ui-element player-info">
                    <div class="player-name">You</div>
                    <div class="player-score" id="player-score">0</div>
                    <div class="player-cards" id="player-cards">5 cards</div>
                </div>
                
                <div class="ui-element game-controls">
                    <button class="btn" id="join-game-btn">Join Game</button>
                    <button class="btn" id="leave-game-btn" disabled>Leave Game</button>
                    <button class="btn" id="new-game-btn">New Game</button>
                </div>
            </div>
            
            <!-- Side UI - Connection and Settings -->
            <div class="side-ui">
                <div class="ui-element connection-status">
                    <div class="status-dot" id="connection-dot"></div>
                    <span id="connection-text">Disconnected</span>
                </div>
                
                <div class="ui-element settings-panel">
                    <select id="quality-select">
                        <option value="ultra">Ultra Quality</option>
                        <option value="high">High Quality</option>
                        <option value="medium">Medium Quality</option>
                        <option value="low">Low Quality</option>
                    </select>
                    
                    <select id="region-select">
                        <option value="moldova">Moldova</option>
                        <option value="transilvania">Transilvania</option>
                        <option value="wallachia">Wallachia</option>
                        <option value="traditional">Traditional</option>
                    </select>
                    
                    <select id="time-select">
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                        <option value="evening" selected>Evening</option>
                        <option value="night">Night</option>
                    </select>
                </div>
            </div>
            
            <!-- Multi-tab Testing Info -->
            <div class="tab-info">
                Open multiple tabs to test multiplayer
            </div>
        </div>
    </div>

    <script>
        console.log(`
🎮 Romanian Septica - Playable Demo
=====================================
🇷🇴 Authentic multiplayer Romanian Septica
🎯 ShuffleCats-quality playable interface
🌐 Multi-tab testing with silent signin
🎨 Premium Three.js rendering with Romanian cultural elements

Instructions:
• Open multiple browser tabs to test multiplayer
• Click cards in your hand to select and play them
• Use dropdown controls to change quality and region
• Watch the console for game events and WebSocket messages

Ready to play traditional Romanian Septica!
        `);

        class PlayableSepticaGame {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.playableInterface = null;
                this.client = null;
                this.lighting = null;
                this.materials = null;
                this.animations = null;
                
                // Game state
                this.isInGame = false;
                this.playerScore = 0;
                this.opponentScore = 0;
                this.currentGameId = null;
                
                this.initialize();
            }
            
            async initialize() {
                console.log('🎮 Initializing Playable Septica Game...');
                
                // Setup Three.js scene
                this.setupThreeJS();
                
                // Initialize premium systems
                await this.initializePremiumSystems();
                
                // Create playable interface
                this.playableInterface = new PlayableCardInterface(this);
                
                // Setup WebSocket client
                this.setupWebSocketClient();
                
                // Setup UI event handlers
                this.setupUIHandlers();
                
                // Start render loop
                this.startRenderLoop();
                
                // Hide loading overlay
                this.hideLoading();
                
                console.log('🎮 Playable Septica Game ready!');
            }
            
            setupThreeJS() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0f172a);
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(
                    75, 
                    window.innerWidth / window.innerHeight, 
                    0.1, 
                    1000
                );
                this.camera.position.set(0, 5, 8);
                this.camera.lookAt(0, 0, 0);
                
                // Renderer
                const canvas = document.getElementById('game-canvas');
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas,
                    antialias: true,
                    alpha: true 
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.2;
                
                console.log('🎨 Three.js setup complete');
            }
            
            async initializePremiumSystems() {
                // Initialize Romanian ambient lighting
                this.lighting = new RomanianAmbientLighting(this.renderer, this.scene);
                this.lighting.createLightingEnvironment('evening', 'moldova');
                
                // Initialize premium card materials
                this.materials = new PremiumCardMaterial();
                
                // Initialize premium animations
                this.animations = new PremiumCardAnimations();
                
                // Create game table
                this.createGameTable();
                
                console.log('🎨 Premium systems initialized');
            }
            
            createGameTable() {
                // Create a simple game table surface
                const tableGeometry = new THREE.CylinderGeometry(4, 4, 0.1, 32);
                const tableMaterial = this.materials.createPremiumTableMaterial('moldova');
                const table = new THREE.Mesh(tableGeometry, tableMaterial);
                table.position.y = -0.5;
                table.receiveShadow = true;
                this.scene.add(table);
            }
            
            setupWebSocketClient() {
                this.client = new SepticaWebSocketClient();
                
                // Set up event handlers
                this.client.onConnectionChange = (connected) => {
                    this.updateConnectionStatus(connected);
                };
                
                this.client.onGameStateUpdate = (gameState) => {
                    if (this.playableInterface) {
                        this.playableInterface.onGameStateUpdate(gameState);
                    }
                    this.updateGameUI(gameState);
                };
                
                this.client.onMessage = (message) => {
                    console.log('📨 WebSocket message:', message);
                    this.handleWebSocketMessage(message);
                };
                
                this.client.onError = (error) => {
                    console.error('❌ WebSocket error:', error);
                };
                
                // Auto-connect
                this.client.connect();
            }
            
            setupUIHandlers() {
                // Connection controls
                document.getElementById('join-game-btn').addEventListener('click', () => {
                    this.joinGame();
                });
                
                document.getElementById('leave-game-btn').addEventListener('click', () => {
                    this.leaveGame();
                });
                
                document.getElementById('new-game-btn').addEventListener('click', () => {
                    this.startNewGame();
                });
                
                // Settings controls
                document.getElementById('quality-select').addEventListener('change', (e) => {
                    this.changeQuality(e.target.value);
                });
                
                document.getElementById('region-select').addEventListener('change', (e) => {
                    this.changeRegion(e.target.value);
                });
                
                document.getElementById('time-select').addEventListener('change', (e) => {
                    this.changeTimeOfDay(e.target.value);
                });
                
                // Window resize handler
                window.addEventListener('resize', () => {
                    this.onWindowResize();
                });
            }
            
            startRenderLoop() {
                const animate = () => {
                    requestAnimationFrame(animate);
                    
                    // Update any animations
                    if (this.animations) {
                        this.animations.update();
                    }
                    
                    // Render the scene
                    this.renderer.render(this.scene, this.camera);
                };
                
                animate();
                console.log('🎮 Render loop started');
            }
            
            // Game control methods
            async joinGame() {
                if (!this.client.isConnected) {
                    await this.client.connect();
                }
                
                if (this.client.isConnected) {
                    console.log('🎮 Joining game...');
                    this.client.joinGame('casual');
                    this.isInGame = true;
                    this.updateGameControls();
                } else {
                    console.error('❌ Cannot join game - not connected to server');
                }
            }
            
            leaveGame() {
                if (this.client.isConnected && this.isInGame) {
                    console.log('🎮 Leaving game...');
                    this.client.leaveGame();
                    this.isInGame = false;
                    this.currentGameId = null;
                    this.updateGameControls();
                }
            }
            
            startNewGame() {
                // For single player testing
                console.log('🎮 Starting new single-player game...');
                this.playerScore = 0;
                this.opponentScore = 0;
                this.updateScores();
                
                if (this.playableInterface) {
                    this.playableInterface.createInitialLayout();
                }
            }
            
            // UI update methods
            updateConnectionStatus(connected) {
                const dot = document.getElementById('connection-dot');
                const text = document.getElementById('connection-text');
                
                if (connected) {
                    dot.classList.add('connected');
                    text.textContent = 'Connected';
                    console.log('🌐 Connected to server');
                } else {
                    dot.classList.remove('connected');
                    text.textContent = 'Disconnected';
                    console.log('🌐 Disconnected from server');
                }
            }
            
            updateGameControls() {
                const joinBtn = document.getElementById('join-game-btn');
                const leaveBtn = document.getElementById('leave-game-btn');
                
                joinBtn.disabled = this.isInGame;
                leaveBtn.disabled = !this.isInGame;
            }
            
            updateGameUI(gameState) {
                if (!gameState) return;
                
                // Update scores
                if (gameState.scores) {
                    this.playerScore = gameState.scores.player || 0;
                    this.opponentScore = gameState.scores.opponent || 0;
                    this.updateScores();
                }
                
                // Update card counts
                if (gameState.handSizes) {
                    document.getElementById('player-cards').textContent = 
                        `${gameState.handSizes.player || 0} cards`;
                    document.getElementById('opponent-cards').textContent = 
                        `${gameState.handSizes.opponent || 0} cards`;
                }
                
                // Update turn indicator
                if (gameState.currentPlayer !== undefined) {
                    const turnIndicator = document.getElementById('turn-indicator');
                    turnIndicator.textContent = gameState.currentPlayer === 1 ? 
                        'Your turn' : 'Opponent\'s turn';
                }
            }
            
            updateScores() {
                document.getElementById('player-score').textContent = this.playerScore;
                document.getElementById('opponent-score').textContent = this.opponentScore;
            }
            
            // Settings methods
            changeQuality(quality) {
                console.log(`🎨 Changing quality to: ${quality}`);
                // Implement quality changes here
            }
            
            changeRegion(region) {
                console.log(`🏛️ Changing region to: ${region}`);
                if (this.lighting) {
                    const timeOfDay = document.getElementById('time-select').value;
                    this.lighting.updateLighting(timeOfDay, region);
                }
                
                if (this.playableInterface) {
                    // Update table material for new region
                    this.scene.children.forEach(child => {
                        if (child.userData && child.userData.isTable) {
                            child.material = this.materials.createPremiumTableMaterial(region);
                        }
                    });
                }
            }
            
            changeTimeOfDay(timeOfDay) {
                console.log(`🌅 Changing time to: ${timeOfDay}`);
                if (this.lighting) {
                    const region = document.getElementById('region-select').value;
                    this.lighting.updateLighting(timeOfDay, region);
                }
            }
            
            // Event handlers
            handleWebSocketMessage(message) {
                switch (message.type) {
                    case 'game_state':
                        this.currentGameId = message.game_id;
                        break;
                    case 'player_joined':
                        console.log('👥 Player joined the game');
                        break;
                    case 'player_left':
                        console.log('👥 Player left the game');
                        break;
                    case 'game_end':
                        console.log('🏁 Game ended');
                        this.isInGame = false;
                        this.updateGameControls();
                        break;
                }
            }
            
            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
            
            hideLoading() {
                const loadingOverlay = document.getElementById('loading-overlay');
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 500);
            }
            
            dispose() {
                if (this.playableInterface) {
                    this.playableInterface.dispose();
                }
                
                if (this.client) {
                    this.client.disconnect();
                }
                
                // Clean up Three.js resources
                this.scene.clear();
                this.renderer.dispose();
            }
        }
        
        // Initialize the game when page loads
        let gameInstance;
        
        window.addEventListener('load', () => {
            gameInstance = new PlayableSepticaGame();
        });
        
        // Clean up when page unloads
        window.addEventListener('beforeunload', () => {
            if (gameInstance) {
                gameInstance.dispose();
            }
        });
    </script>
</body>
</html>
