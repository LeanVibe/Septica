# NGINX Ingress Controller Configuration for Romanian Septica
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: septica-ingress
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: ingress
  annotations:
    # NGINX Ingress Controller Configuration
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    
    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # WebSocket Support for real-time gameplay
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "septica-backend"
    
    # CORS Headers for Romanian domain
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://septica.ro,https://www.septica.ro"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # Rate Limiting for DDoS Protection
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self';" always;
      
    # GeoIP blocking (except EU and permitted countries)
    nginx.ingress.kubernetes.io/server-snippet: |
      set $allowed_country 0;
      if ($geoip_country_code = RO) { set $allowed_country 1; }
      if ($geoip_country_code = MD) { set $allowed_country 1; }
      if ($geoip_country_code = BG) { set $allowed_country 1; }
      if ($geoip_country_code = HU) { set $allowed_country 1; }
      if ($geoip_country_code = RS) { set $allowed_country 1; }
      if ($geoip_country_code = IT) { set $allowed_country 1; }
      if ($geoip_country_code = ES) { set $allowed_country 1; }
      if ($geoip_country_code = FR) { set $allowed_country 1; }
      if ($geoip_country_code = DE) { set $allowed_country 1; }
      if ($allowed_country = 0) { return 403; }

spec:
  tls:
  - hosts:
    - septica.ro
    - www.septica.ro
    - api.septica.ro
    secretName: septica-tls
  
  rules:
  # Main website (www.septica.ro and septica.ro)
  - host: septica.ro
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: septica-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: septica-backend
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: septica-backend
            port:
              number: 8080
              
  - host: www.septica.ro
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: septica-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: septica-backend
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: septica-backend
            port:
              number: 8080

  # API subdomain (api.septica.ro)
  - host: api.septica.ro
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: septica-backend
            port:
              number: 8080

---
# Cluster Issuer for Let's Encrypt SSL certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@septica.ro  # Replace with actual email
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
      selector:
        dnsNames:
        - septica.ro
        - www.septica.ro
        - api.septica.ro

---
# Network Policy for ingress traffic control
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: septica-ingress-netpol
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: romanian-septica
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 80
  egress:
  - {} # Allow all egress traffic