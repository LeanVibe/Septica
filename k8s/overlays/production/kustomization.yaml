apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: romanian-septica-production
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  - ../../base
  - pod-security-policy.yaml
  - network-policy-strict.yaml

namespace: septica

commonLabels:
  environment: production
  app.kubernetes.io/instance: production

patches:
  # Production replicas for high availability
  - target:
      kind: Deployment
      name: septica-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
  
  - target:
      kind: Deployment
      name: septica-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  
  # Production resource allocation
  - target:
      kind: Deployment
      name: septica-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 800m
  
  # Production HPA settings
  - target:
      kind: HorizontalPodAutoscaler
      name: septica-backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 5
      - op: replace
        path: /spec/maxReplicas
        value: 20
  
  - target:
      kind: HorizontalPodAutoscaler
      name: septica-frontend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  
  # Production database settings
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 100Gi
  
  # Production ingress with SSL
  - target:
      kind: Ingress
      name: septica-ingress
    patch: |-
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "true"
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1force-ssl-redirect
        value: "true"
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: "letsencrypt-prod"

images:
  - name: septica/backend
    newName: ghcr.io/bogdan/septica/backend
    newTag: latest
  - name: septica/frontend
    newName: ghcr.io/bogdan/septica/frontend
    newTag: latest

secretGenerator:
  # Production secrets (should be managed through external secret management)
  - name: septica-secrets
    behavior: replace
    literals:
      - DATABASE_URL=postgres://septica_prod:CHANGE_ME_PRODUCTION_PASSWORD@postgres:5432/septica_prod?sslmode=require
      - JWT_SECRET=CHANGE_ME_PRODUCTION_JWT_SECRET_64_CHARS_MINIMUM
      - GAME_ENCRYPTION_KEY=CHANGE_ME_PROD_GAME_KEY_32_CHARS
      - SESSION_SECRET=CHANGE_ME_PRODUCTION_SESSION_SECRET