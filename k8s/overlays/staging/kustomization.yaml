apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: romanian-septica-staging
  annotations:
    config.kubernetes.io/local-config: "true"

resources:
  - ../../base

namespace: septica-staging

namePrefix: staging-

commonLabels:
  environment: staging
  app.kubernetes.io/instance: staging

patches:
  # Reduce replicas for staging
  - target:
      kind: Deployment
      name: septica-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  
  - target:
      kind: Deployment
      name: septica-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  
  # Staging resource limits
  - target:
      kind: Deployment
      name: septica-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 250m
  
  # Staging-specific configuration
  - target:
      kind: ConfigMap
      name: septica-config
    patch: |-
      - op: replace
        path: /data/GAME_MAX_CONCURRENT_GAMES
        value: "100"
      - op: replace
        path: /data/WEBSOCKET_MAX_CONNECTIONS
        value: "200"
      - op: replace
        path: /data/LOG_LEVEL
        value: "debug"

images:
  - name: septica/backend
    newName: ghcr.io/bogdan/septica/backend
    newTag: staging-latest
  - name: septica/frontend
    newName: ghcr.io/bogdan/septica/frontend
    newTag: staging-latest

secretGenerator:
  - name: septica-secrets
    behavior: replace
    literals:
      - DATABASE_URL=postgres://septica_staging:staging_password@postgres:5432/septica_staging?sslmode=require
      - JWT_SECRET=staging-jwt-secret-key
      - GAME_ENCRYPTION_KEY=staging-game-encryption-key-32
      - SESSION_SECRET=staging-session-secret-key