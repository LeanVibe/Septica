apiVersion: v1
kind: ConfigMap
metadata:
  name: septica-config
  namespace: septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: configuration
data:
  # Romanian Septica Game Configuration
  GAME_MAX_CONCURRENT_GAMES: "1000"
  WEBSOCKET_MAX_CONNECTIONS: "2000"
  TOURNAMENT_ENABLED: "true"
  
  # Romanian Cultural Settings
  GAME_LOCALE: "ro-RO"
  TIMEZONE: "Europe/Bucharest"
  
  # Performance Settings
  GIN_MODE: "release"
  LOG_LEVEL: "info"
  
  # Database Configuration
  DB_MAX_CONNECTIONS: "25"
  DB_MAX_IDLE_CONNECTIONS: "5"
  DB_MAX_LIFETIME: "300s"
  
  # Redis Configuration
  REDIS_MAX_CONNECTIONS: "10"
  REDIS_IDLE_TIMEOUT: "240s"
  
  # WebSocket Configuration
  WS_READ_BUFFER_SIZE: "1024"
  WS_WRITE_BUFFER_SIZE: "1024"
  WS_HEARTBEAT_INTERVAL: "30s"
  WS_HEARTBEAT_TIMEOUT: "60s"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: configuration
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log /var/log/nginx/access.log main;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        
        include /etc/nginx/conf.d/*.conf;
    }
  
  default.conf: |
    upstream septica_backend {
        server septica-backend:8080;
    }
    
    server {
        listen 80;
        server_name _;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        
        # WebSocket proxy for multiplayer
        location /ws/ {
            proxy_pass http://septica_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        
        # API proxy
        location /api/ {
            proxy_pass http://septica_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        
        # Health check
        location /health {
            proxy_pass http://septica_backend;
            access_log off;
        }
        
        # Static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }