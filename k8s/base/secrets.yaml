apiVersion: v1
kind: Secret
metadata:
  name: septica-secrets
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials (to be replaced in production)
  DATABASE_URL: "postgres://septica:septica@postgres:5432/septica?sslmode=require"
  POSTGRES_USER: "septica"
  POSTGRES_PASSWORD: "septica"
  POSTGRES_DB: "septica"
  
  # Redis credentials
  REDIS_URL: "redis://redis:6379"
  REDIS_PASSWORD: ""
  
  # JWT Secret for authentication
  JWT_SECRET: "your-jwt-secret-key-change-in-production"
  
  # Game encryption keys
  GAME_ENCRYPTION_KEY: "your-game-encryption-key-32-chars"
  
  # Session secret
  SESSION_SECRET: "your-session-secret-key-change-me"

---
# TLS Certificate Secret (to be created with actual certificates)
apiVersion: v1
kind: Secret
metadata:
  name: septica-tls
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # Replace with actual values:
  # tls.crt: LS0tLS1CRUdJTi... (base64 encoded certificate)
  # tls.key: LS0tLS1CRUdJTi... (base64 encoded private key)
  tls.crt: ""
  tls.key: ""