# Backup and Disaster Recovery for Romanian Septica
# Production-ready backup strategy with automated scheduling

---
# Backup Storage PVC for PostgreSQL dumps
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: septica-backup-storage
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # Store 30 days of backups
  storageClassName: standard

---
# ConfigMap with backup scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup
data:
  backup-database.sh: |
    #!/bin/bash
    set -e
    
    # Romanian Septica Database Backup Script
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_DIR="/backup"
    DB_HOST="postgres"
    DB_PORT="5432"
    DB_NAME="septica"
    DB_USER="septica"
    
    echo "[$(date)] Starting Romanian Septica database backup..."
    
    # Create backup directory if it doesn't exist
    mkdir -p $BACKUP_DIR
    
    # Perform database backup with custom format for faster restore
    BACKUP_FILE="$BACKUP_DIR/septica_backup_$TIMESTAMP.sql"
    pg_dump -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME \
        --no-password \
        --verbose \
        --format=custom \
        --compress=9 \
        --file="$BACKUP_FILE.pgdump"
    
    # Also create human-readable SQL backup
    pg_dump -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME \
        --no-password \
        --verbose \
        --format=plain \
        --inserts \
        --file="$BACKUP_FILE"
    
    # Compress SQL backup
    gzip "$BACKUP_FILE"
    
    # Verify backup integrity
    echo "[$(date)] Verifying backup integrity..."
    if pg_restore --list "$BACKUP_FILE.pgdump" > /dev/null 2>&1; then
        echo "[$(date)] Backup verification successful"
    else
        echo "[$(date)] ERROR: Backup verification failed"
        exit 1
    fi
    
    # Calculate backup size
    BACKUP_SIZE=$(du -h "$BACKUP_FILE.pgdump" | cut -f1)
    echo "[$(date)] Backup completed successfully: $BACKUP_FILE.pgdump ($BACKUP_SIZE)"
    
    # Cleanup old backups (keep 30 days)
    find $BACKUP_DIR -name "septica_backup_*.pgdump" -mtime +30 -delete
    find $BACKUP_DIR -name "septica_backup_*.sql.gz" -mtime +30 -delete
    
    echo "[$(date)] Romanian Septica backup process completed"

  restore-database.sh: |
    #!/bin/bash
    set -e
    
    # Romanian Septica Database Restoration Script
    if [ -z "$1" ]; then
        echo "Usage: $0 <backup_file>"
        echo "Available backups:"
        ls -la /backup/septica_backup_*.pgdump
        exit 1
    fi
    
    BACKUP_FILE="$1"
    DB_HOST="postgres"
    DB_PORT="5432"
    DB_NAME="septica"
    DB_USER="septica"
    
    echo "[$(date)] Starting Romanian Septica database restoration..."
    echo "[$(date)] Backup file: $BACKUP_FILE"
    
    # Verify backup file exists
    if [ ! -f "$BACKUP_FILE" ]; then
        echo "ERROR: Backup file not found: $BACKUP_FILE"
        exit 1
    fi
    
    # Create temporary database for restoration
    TEMP_DB="septica_restore_$(date +%s)"
    createdb -h $DB_HOST -p $DB_PORT -U $DB_USER $TEMP_DB
    
    # Restore to temporary database first
    echo "[$(date)] Restoring to temporary database: $TEMP_DB"
    pg_restore -h $DB_HOST -p $DB_PORT -U $DB_USER -d $TEMP_DB \
        --no-password \
        --verbose \
        --clean \
        --if-exists \
        "$BACKUP_FILE"
    
    # Verify restoration
    echo "[$(date)] Verifying restoration..."
    RESTORED_TABLES=$(psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $TEMP_DB -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';")
    
    if [ "$RESTORED_TABLES" -gt 0 ]; then
        echo "[$(date)] Restoration verification successful ($RESTORED_TABLES tables)"
        
        # Rename databases (swap)
        echo "[$(date)] Swapping databases..."
        psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d postgres -c "ALTER DATABASE septica RENAME TO septica_old_$(date +%s);"
        psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d postgres -c "ALTER DATABASE $TEMP_DB RENAME TO septica;"
        
        echo "[$(date)] Romanian Septica database restoration completed successfully"
    else
        echo "ERROR: Restoration verification failed"
        dropdb -h $DB_HOST -p $DB_PORT -U $DB_USER $TEMP_DB
        exit 1
    fi

  backup-application-data.sh: |
    #!/bin/bash
    set -e
    
    # Romanian Septica Application Data Backup
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_DIR="/backup/app-data"
    
    echo "[$(date)] Starting application data backup..."
    
    mkdir -p $BACKUP_DIR
    
    # Backup Prometheus metrics (if needed)
    if kubectl get pods -n monitoring | grep prometheus > /dev/null 2>&1; then
        echo "[$(date)] Backing up Prometheus data..."
        kubectl exec -n monitoring deployment/prometheus -- tar czf - /prometheus | \
            cat > "$BACKUP_DIR/prometheus_data_$TIMESTAMP.tar.gz"
    fi
    
    # Backup Grafana dashboards and settings
    if kubectl get pods -n monitoring | grep grafana > /dev/null 2>&1; then
        echo "[$(date)] Backing up Grafana data..."
        kubectl exec -n monitoring deployment/grafana -- tar czf - /var/lib/grafana | \
            cat > "$BACKUP_DIR/grafana_data_$TIMESTAMP.tar.gz"
    fi
    
    # Backup Redis data (game sessions)
    echo "[$(date)] Backing up Redis data..."
    kubectl exec -n romanian-septica deployment/redis -- redis-cli BGSAVE
    sleep 5  # Wait for background save to complete
    kubectl exec -n romanian-septica deployment/redis -- tar czf - /data | \
        cat > "$BACKUP_DIR/redis_data_$TIMESTAMP.tar.gz"
    
    echo "[$(date)] Application data backup completed"

---
# Secret for backup credentials
apiVersion: v1
kind: Secret
metadata:
  name: backup-credentials
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup
type: Opaque
stringData:
  PGPASSWORD: "septica"  # Replace with actual password from main secrets
  AWS_ACCESS_KEY_ID: ""  # For S3 backups
  AWS_SECRET_ACCESS_KEY: ""  # For S3 backups
  BACKUP_ENCRYPTION_KEY: "romanian-septica-backup-key-2024"

---
# Daily backup CronJob for PostgreSQL
apiVersion: batch/v1
kind: CronJob
metadata:
  name: septica-database-backup
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM Bucharest time
  timezone: "Europe/Bucharest"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: romanian-septica
            app.kubernetes.io/component: backup-job
        spec:
          restartPolicy: OnFailure
          containers:
          - name: postgres-backup
            image: postgres:14-alpine
            command:
            - /bin/bash
            - /scripts/backup-database.sh
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: backup-credentials
                  key: PGPASSWORD
            volumeMounts:
            - name: backup-scripts
              mountPath: /scripts
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                memory: 256Mi
                cpu: 100m
              limits:
                memory: 512Mi
                cpu: 500m
          volumes:
          - name: backup-scripts
            configMap:
              name: backup-scripts
              defaultMode: 0755
          - name: backup-storage
            persistentVolumeClaim:
              claimName: septica-backup-storage

---
# Weekly application data backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: septica-app-data-backup
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup
spec:
  schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
  timezone: "Europe/Bucharest"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: romanian-septica
            app.kubernetes.io/component: backup-job
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backup-service-account
          containers:
          - name: app-data-backup
            image: bitnami/kubectl:latest
            command:
            - /bin/bash
            - /scripts/backup-application-data.sh
            env:
            - name: BACKUP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: backup-credentials
                  key: BACKUP_ENCRYPTION_KEY
            volumeMounts:
            - name: backup-scripts
              mountPath: /scripts
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 256Mi
                cpu: 200m
          volumes:
          - name: backup-scripts
            configMap:
              name: backup-scripts
              defaultMode: 0755
          - name: backup-storage
            persistentVolumeClaim:
              claimName: septica-backup-storage

---
# Service Account for backup operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-service-account
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup

---
# ClusterRole for backup operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-operator
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]

---
# ClusterRoleBinding for backup operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-operator-binding
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-operator
subjects:
- kind: ServiceAccount
  name: backup-service-account
  namespace: romanian-septica

---
# Disaster Recovery Job Template (manual execution)
apiVersion: batch/v1
kind: Job
metadata:
  name: septica-disaster-recovery
  namespace: romanian-septica
  labels:
    app.kubernetes.io/name: romanian-septica
    app.kubernetes.io/component: disaster-recovery
  annotations:
    # To execute: kubectl create -f this-file.yaml
    description: "Manual disaster recovery job for Romanian Septica"
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: romanian-septica
        app.kubernetes.io/component: disaster-recovery
    spec:
      restartPolicy: Never
      containers:
      - name: disaster-recovery
        image: postgres:14-alpine
        command:
        - /bin/bash
        - -c
        - |
          echo "Romanian Septica Disaster Recovery Procedure"
          echo "=============================================="
          echo ""
          echo "Available database backups:"
          ls -la /backup/septica_backup_*.pgdump
          echo ""
          echo "To restore a specific backup, run:"
          echo "/scripts/restore-database.sh /backup/septica_backup_YYYYMMDD_HHMMSS.pgdump"
          echo ""
          echo "This job will wait for manual intervention..."
          sleep 3600  # Wait 1 hour for manual operations
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: backup-credentials
              key: PGPASSWORD
        volumeMounts:
        - name: backup-scripts
          mountPath: /scripts
        - name: backup-storage
          mountPath: /backup
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 300m
      volumes:
      - name: backup-scripts
        configMap:
          name: backup-scripts
          defaultMode: 0755
      - name: backup-storage
        persistentVolumeClaim:
          claimName: septica-backup-storage